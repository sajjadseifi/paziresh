{% extends 'shared/_PanelMain.html' %}
{% load static %}




{% block main %}
    <section class="content">
        <div class="box">
            <div class="box-header">
                <h3 class="box-title">گروهان ها</h3>

                <div class="box-body no-padding">
                    <table class="table">
                        <tbody>
                        <tr>
                            <th>نام گروهان</th>
                            <th>نام گردان</th>
                            <th>ظرفیت</th>
                            <th></th>
                        </tr>
                        {% for foo in grohan %}
                            <tr>
                                <td>{{ foo.name }}</td>
                                <td><span class="badge bg-red">{{ foo.gordan.name }}</span></td>
                                <td><span class="badge bg-red">{{ foo.zarfiat }}</span></td>
                                <td>
                                    <a class="btn btn-app" href="{% url 'BattalionGroupUpdate' pk=foo.pk %}">
                                        <i class="fa fa-edit"></i> ویرایش
                                    </a>
                                </td>
                            </tr>
                        {% endfor %}
                        </tbody>
                    </table>
                </div>
                <!-- /.box-body -->
            </div>
        </div>
    </section>
{% endblock %}
