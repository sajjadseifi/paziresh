<style>

<style>
        .app-navbar {

</style>

<style>
    /* ستون‌ها */
.col-2 {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 5%;
}

/* هر آیتم داخل ستون */
.col-2 > * {
    flex: 1 1 45%; /* حداقل 45% عرض، ولی می‌تونه کوچک‌تر یا بزرگ‌تر بشه */
    width: 45%;
    box-sizing: border-box;
}
.col-2 > .full {
    flex: 1 1 95%; /* حداقل 45% عرض، ولی می‌تونه کوچک‌تر یا بزرگ‌تر بشه */
    width: 95%;
}
/* ریسپانسیو برای موبایل */
@media (max-width: 768px) {
    .col-2 > * {
        flex: 1 1 100%; /* روی موبایل هر آیتم تمام عرض باشه */
        max-width: 100%;
    }
    .col-2 {
        gap: 10px; /* فاصله کمتر و مناسب موبایل */
    }
}
    .form-group-linear {
        display: flex;
        align-items: center;
        gap: 10px;
    }
</style>
<script>
      const onCopyToClipBoard = async (text) => {
            try {
                  await navigator.clipboard.writeText(text);
                  showToast(`متن "${text}" کپی شد`)
            } catch (err) {
                  showToast(`خطا در کپی متن!`,type="erorr")
            }
      };
</script>
