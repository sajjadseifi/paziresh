<form id="changePasswordForm" class="access-form" method="post" action="{% url 'user_change_password_form' %}?user_id={{ user.id }}">
    {% csrf_token %}

    <div class="form-row">
        <div class="form-group">
           <label>
               <input type="password" name="password" value="" required>
               <span>گذرواژه</span>
          </label>
        </div>
        <div class="form-group">
            <label>
                <input type="password" name="password_confirm" value="" required>
                <span>تایید گذرواژه</span>
            </label>
        </div>
    </div>
    <!-- دکمه ذخیره -->
    <div class="form-actions">
        <button type="submit">ذخیره اطلاعات</button>
    </div>
</form>
