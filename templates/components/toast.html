
<style>
    .toast-success { background-color: #4caf50; }  /* سبز */
    .toast-error { background-color: #f44336; }    /* قرمز */
    .toast-warning { background-color: #ff9800; }  /* نارنجی */
    .toast-info { background-color: #2196f3; }     /* آبی */
</style>

<!-- components/toast.html -->
<div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 9999;">
    {% if messages %}
        {% for message in messages %}
            <div class="toast toast-{{ message.tags }}" style="min-width: 250px; margin-bottom: 10px; padding: 12px 16px; border-radius: 8px; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.2); opacity: 0; transition: opacity 0.5s;">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
</div>

<script>
    /**
 * ایجاد و نمایش یک Toast
 * @param {string} message متن پیام
 * @param {string} type نوع پیام: success, error, warning, info
 * @param {number} duration مدت زمان نمایش به میلی‌ثانیه (اختیاری، پیش‌فرض 3000)
 */
function showToast(message, type="info", duration=3000) {
    const container = document.getElementById("toast-container");
    const toast = document.createElement("div");
    toast.classList.add("toast", `toast-${type}`);
    toast.textContent = message;
    container.appendChild(toast);

    // نمایش با انیمیشن
    setTimeout(() => {
        toast.style.opacity = "1";
        toast.style.transform = "translateX(0)";
    }, 50);

    // محو شدن و حذف بعد از مدت زمان
    setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateX(100%)";
        setTimeout(() => toast.remove(), 500);
    }, duration);
}
    document.addEventListener("DOMContentLoaded", function() {
        const toasts = document.querySelectorAll("#toast-container .toast");
        toasts.forEach((toast, index) => {
            setTimeout(() => {
                toast.style.opacity = 1; // نمایش
            }, index * 200); // تاخیر کوچک برای پشت سر هم

            setTimeout(() => {
                toast.style.opacity = 0; // محو شدن
                setTimeout(() => toast.remove(), 500);
            }, 3000 + index * 200); // 3 ثانیه نمایش
        });
    });
</script>
