{% extends 'shared/_PanelMain.html' %}
{% load static %}
{% load jalali_filters %}

{% block main %}
<div class="container mt-4">
    <!-- فرم کد ملی -->
    <div class="row mb-4">
        <div class="col-md-12">
            <div class="box p-3">
                <div class="box-header with-border mb-2">
                    <h3 class="box-title">پذیرش با کد ملی</h3>
                </div>
                <form action="" method="post">
                    {% csrf_token %}
                    <div class="box-body">
                        <div id="code_meli" class="input-group input-group-sm">
                            {{ SarbazCodeMeli.code_meli }}
                            <span class="text-danger ml-2">{{ SarbazCodeMeli.code_meli.errors }}</span>
                            <span class="input-group-btn">
                                <button type="submit" class="btn btn-info btn-flat">بررسی</button>
                            </span>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    {% include "components/last_acceptance_soldiers.html" with soldiers=soldiers %}
<script>
    window.onload = function() {
        document.querySelector("#code_meli input").focus();
    };
</script>

{% endblock %}
