
<style>
    .toast-success { color: #4caf50; }  /* سبز */
    .toast-error { color: #f44336; }    /* قرمز */
    .toast-warning { color: #ff9800; }  /* نارنجی */
    .toast-info { color: #2196f3; }     /* آبی */
    .toast {
        min-width: 250px;
        padding: 12px 16px; 
        border-radius: 8px; 
        background-color: white;
        border: 1px solid rgba(0,0,0,0.2);
        box-shadow: 0 2px 8px rgba(0,0,0,0.2); 
        transition: opacity 0.5s;
        opacity: 0;
        visibility: hidden;
        transform: translateY(0);
    }
    .toast.show {
        opacity: 1;
        visibility: visible;
        transform: translateY(-100%);
    }

    #toast-container {

        position: fixed; 
        bottom: 0; 
        left: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px; 
        left: z-index: 9999;
    }
</style>

<!-- components/toast.html -->
<div id="toast-container" >
    {% if messages %}
        {% for message in messages %}
            <div class="toast toast-{{ message.tags }}" >
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
</div>

<script>
/**
     * ایجاد و نمایش یک Toast
     * @param {string} message متن پیام
     * @param {string} type نوع پیام: success, error, warning, info
     * @param {number} duration مدت زمان نمایش به میلی‌ثانیه (اختیاری، پیش‌فرض 3000)
 */
function showToast(message, type="info", duration=3000) {
    const container = document.getElementById("toast-container");
    const toast = document.createElement("div");
    toast.classList.add("toast", `toast-${type}`);
    toast.textContent = message;
    container.appendChild(toast);

    const show = () => toast.classList.add('show')
    const hidden = () => {
        toast.classList.remove('show') 
        setTimeout(() => toast.remove(), 500);
    }
    
    // نمایش با انیمیشن
    setTimeout(show, 50);
    // محو شدن و حذف بعد از مدت زمان
    setTimeout(hidden, duration);
}
    document.addEventListener("DOMContentLoaded", function() {
        const toasts = document.querySelectorAll("#toast-container .toast");
        toasts.forEach((toast, index) => {
            // تاخیر کوچک برای پشت سر هم
            setTimeout(show, index * 200); 
            // 3 ثانیه نمایش
            setTimeout(hidden, 3000 + index * 200); 
        });
    });
</script>
