{% extends 'shared/_PanelMain.html' %}
{% load static %}


{% block main %}
    <div class="box box-warning">
        <div class="box-header with-border">
            <h3 class="box-title">اطلاعات سرباز</h3>
        </div>
        <!-- /.box-header -->
        <div class="box-body">
            <form role="form" method="post">
                {% csrf_token %}
                <div class="box-body">
                    <div class="row">
                        <div class="col-xs-6">
                            {{ form.name.label }}
                            {{ form.name }}

                        </div>
                        <div class="col-xs-6">
                            {{ form.order.label }}
                            {{ form.order }}

                        </div>
                    </div>
                </div>
                <div class="box-body">
                    {{ form.is_active.label }}
                    {{ form.is_active }}
                </div>
                <button type="submit" class="btn btn-success pull-right">ایجاد</button>
            </form>

        </div>
        <!-- /.box-body -->
    </div>
{% endblock %}
