{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سامانه رزم‌آموز</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="{% static 'dist/css/rtl.css' %}">
    <link rel="stylesheet" href="{% static 'dist/css/fonts.css' %}">
    <link rel="stylesheet" href="{% static 'bower_components/font-awesome/css/font-awesome.min.css' %}">
    <link rel="stylesheet" href="{% static 'bower_components/Ionicons/css/ionicons.min.css' %}">
    <link rel="stylesheet" href="{% static 'plugins/iCheck/square/blue.css' %}">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: url("{% static 'img/rahbari.jpg' %}") center center/cover no-repeat fixed;
        }
        html body * {
            font-family: Vazir, sans-serif;
        }
        .overlay {
            width: 100%;
            height: 100vh;
            backdrop-filter: blur(3px);
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .login-card {
            width: 620px;
            padding: 40px 35px;
            background: rgba(40, 40, 40, 0.8);
            border-radius: 18px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.35);
            backdrop-filter: blur(18px);
            animation: fadeIn 0.7s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2.title {
            text-align: center;
            color: #3a8bff;
            font-size: 33px;
            margin: 0;
        }

        .login-content {
            display: flex;
            align-items: center;
            gap: 40px;
            margin-top: 25px;
        }

        .logo-card {
            text-align: center;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .logo-card-image {
            background-color: rgba(255,255,255,0.75);
            border-radius: 12px;
            padding: 10px;
            text-align: center;

        }

        .logo {
            width: 100px;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
        }

        .form-group {
            margin-bottom: 25px;
            display: flex;
            align-items: center;
        }

        label {
            color: #e7e7e7;
            font-size: 18px;
            margin-bottom: 5px;
            display: block;
            font-weight: bold;
            flex: 1;
        }

        .input-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #3a7bd5;
        }

        .toggle-password {
            position: absolute;
            right: -40px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #3a7bd5;
            cursor: pointer;
        }
        .input {
            flex: 3;
            position: relative;
        }
        input {
            padding: 12px 40px 12px 12px;
            border-radius: 10px;
            font-size: 16px;
            border: 1px solid rgba(220,220,220,0.3);
            background: rgba(255,255,255,0.18);
            color: #fff;
            outline: none;
            transition: 0.25s;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
            text-align: left;
            line-height: 16px;
        }

        input::placeholder {
            color: #ddd;
            text-align: right;
        }

        input:focus {
            border-color: #67aaff;
            box-shadow: 0 0 10px rgba(93,168,255,0.45);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            background: linear-gradient(135deg, #3a7bd5, #29b6f6);
            border: none;
            color: white;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 4px 20px rgba(0,140,255,0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(0,160,255,0.5);
        }

        .login-footer {
            text-align: center;
            margin-top: 25px;
            color: #96caff;
            font-size: 18px;
        }

        .app-version {
            display: inline-block;
            background-color: #ff8800;
            color: white;
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 4px;
            margin: 15px auto 0;
        }

        .app-name {
            display: inline-block;
            background-color: #6200ffff;
            color: white;
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 4px;
            margin: 15px auto 0;
        }
        .login-form {
            flex: 1;
        }
        .organ-title {
            color: chartreuse;
            text-align: center;
            font-size: 18px;
        }
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }

        .d-none {
            display: none;
        }

        @keyframes spin {
        to { transform: rotate(360deg); }
        }

    </style>
</head>

<body>

<div class="overlay">
    <div class="login-card">
        <div class="logo-card">
            <div class="logo-card-image">
                <img src="{% static 'img/Sepah.png' %}" class="logo">
            </div>
            <p style="margin-top: 10px; font-size: 15px;">نیروی زمینی سپاه</p>
            {% comment %} <p style="margin-top: -10px; font-size: 14px;">انفلاب اسلامی ایران</p> {% endcomment %}
        </div>
        <h2 class="title">سامانه پذیرش هوشمند رزم‌آموز</h2>
        <h2 class="organ-title">آموزشگاه رزم مقدماتی المهدی (عج) نیروی زمینی سپاه</h2>
        <hr style="border-color: rgba(255,255,255,0.15)">
        <div class="login-content">
            <!-- لوگو -->

            <!-- فرم -->
            <form id="loginForm" class="login-form" method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label>نام کاربری</label>
                    <div class="input">
                        <i class="fa fa-user input-icon"></i>
                        {{ login_form.username }}
                    </div>
                </div>

                <div class="form-group">
                    <label>رمز عبور</label>
                    <div class="input">
                        <i class="fa fa-lock input-icon"></i>
                        <i class="fa fa-eye toggle-password" id="togglePassword"></i>
                        {{ login_form.password }}
                    </div>
                </div>
                <button type="submit" class="btn" id="submitBtn">
                    <span class="btn-text">ورود به سامانه</span>
                    <span class="spinner d-none"></span>
                </button>
            </form>

        </div>

        <footer class="login-footer">
            <div style="text-align: center;">
                <span class="app-name">سامانه {{app.name}}</span>
                <span class="app-version">نسخه {{app.version}}</span>
            </div>
        </footer>
    </div>

</div>


<script>
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.querySelector("input[type='password']");

    togglePassword.addEventListener("click", () => {
        const type = passwordInput.type === "password" ? "text" : "password";
        passwordInput.type = type;

        togglePassword.classList.toggle("fa-eye");
        togglePassword.classList.toggle("fa-eye-slash");
    });
</script>
<script>
  const form = document.getElementById('loginForm');
  const btn = document.getElementById('submitBtn');
  const btnText = btn.querySelector('.btn-text');
  const spinner = btn.querySelector('.spinner');

  let isSubmitting = false;

  form.addEventListener('submit', function (e) {
    if (isSubmitting) return;

    e.preventDefault(); // جلوی ارسال فوری رو بگیر
    isSubmitting = true;

    btn.disabled = true;
    btnText.classList.add('d-none');
    spinner.classList.remove('d-none');

    // Delay 2 ثانیه‌ای نمایشی
    setTimeout(() => {
      form.submit(); // بعد از 2 ثانیه واقعاً بفرست سمت سرور
    }, 200);
  });
</script>

</body>
</html>
