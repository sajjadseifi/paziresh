{% extends 'shared/_PanelMain.html' %}

{% block main %}
    <style>
        .box {
            border-radius: 20px;
            padding:  10px 20px;
        }
        .box-title {
            font-weight: bold;
        }
        .form-group {
            display: flex;
            align-items: center;
            margin: 2px 0;
        }
        .form-group > label {
            flex: 2;
        }
        
        .form-group > * {
            flex: 3;
            font-size: 12px;
        }
        .form-group > input,select {
            border-radius: 6px;
            padding: 2px 8px;
            border: 1px solid #ccc;
        }
        .btn-search {
            padding: 8px 40px !important;
            border-radius: 10px;
        }
</style>
<div class="row">
    <div class="col-xs-12">
        <div class="box">
            <div class="box-body">
                <form method="GET">
                    <div class="row">
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="acceptance_status">وضعیت پذیرش</label>
                                <select id="acceptance_status" name="acceptance_status">
                                    {% for value,label in acceptance_status_list  %}
                                        <option value="{{value}}" {% if acceptance_status == value %}selected{% endif %}>
                                            {{label}}
                                        </option>
                                    {% empty %}
                                        <option value="" selected>همه</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="acceptance_code">عدد پذیرش</label>
                                <input type="text" class="form-control" id="acceptance_code" name="acceptance_code" placeholder="عدد پذیرش" value="{{acceptance_code}}" >
                            </div>
                        </div>
                         <div class="col-md-4">
                            <div class="form-group">
                                <label for="national_code">کد ملی</label>
                                <input type="text" class="form-control" id="national_code" name="national_code" placeholder="کد ملی" value="{{national_code}}">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="status_type">وضعیت برگه اعزام</label>
                                <select id="status_type" name="status_type">
                                    <option class="status-type default" value="">همه</option>
                                    <option class="status-type default" value="no">ندارد</option>
                                    {% for status in status_types %}
                                        <option class="status-type unkhown" value="{{status}}" {% if status == status_type %}selected{% endif %}>
                                            {{status}}
                                        </option>
                                    {% endfor %}
                                    {% for status in unkhown_status_types %}
                                        <option class="status-type unkhown" value="{{status}}" {% if status == status_type %}selected{% endif %}>
                                            {{status}} (تعریف نشده)
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="name">نام</label>
                                <input type="text" class="form-control" id="name" name="name" placeholder="نام سرباز" value="{{name}}">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="family">نام خانوادگی</label>
                                <input type="text" class="form-control" id="family" name="family" placeholder="نام خانوادگی" value="{{family}}">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="national_code">گردان اولیه</label>
                                <select id="gordan" name="gordan">
                                    <option value="">نمایش همه</option>
                                    <option value="no">ندارد</option>
                                    {% for g in gordans %}
                                        <option gordan-name="{{g.name}}" id="option_gordan_{{g.id}}" value="{{g.id}}">{{g.name}}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="national_code">گروهان اولیه</label>
                                <select name="group" id="battaliongroup">
                                    <option value="">یک گردان انتخاب کنید.</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div style="margin: 10px;display: flex;align-items: center;">
                        <div style="flex:1;display: flex;a;inset: center;gap: 20px;">
                            <span class="box-title">فهرست پذیرش اولیه فراگیران</span>
                            <span>نتیجه {{results|length}} نفر یافت شد!</span>
                        </div>
                        <button type="submit" class="btn-search btn btn-primary" >جستجو</button>
                        <div style="flex: 1;"></div>
                    </div>

                </form>
                <div class="table-responsive " style="max-height: 70svh;overflow-y: auto;">
                    {% include '../components/paziresh_soldiers_table.html' with soldiers=results %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block footer %}
    <script>
        document.getElementById('gordan').addEventListener('change', function () {
            const gordanId = this.value;
            const battalionGroup = document.getElementById('battaliongroup');
            battalionGroup.innerHTML = `
                <option value="">همه</option>
                <option value="no">ندارد</option>
            `;
            if (!gordanId || gordanId == 'no'){
                return
            }
            
            const optionSelected = document.getElementById(`option_gordan_${gordanId}`)
            const gordanName = optionSelected.getAttribute('gordan-name');

            if (gordanName) {
                const baseUrl = `{% url 'get_grohan_by_gordan_for_search' %}`
                const qs = `gordan_name=${gordanName}`
                const requestUrl = `${baseUrl}?${qs}`
                fetch(requestUrl).then(response => response.json()).then(data => {
                    data.forEach(item => {
                        const option = document.createElement('option');
                        option.value = item.name;
                        option.textContent = `گروهان ${item.name}`;
                        battalionGroup.appendChild(option);
                    });
                })
                .catch(error => console.error('Error:', error));
            }
        });
    </script>
{% endblock %}
