<style>
/* عنوان با گرادینت و انیمیشن */
h1 {
    color:#126b57;
    font-size: 1.6em;
    font-weight: 700;
    padding:0;
    margin:0;
    padding-bottom: 16px;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
}

/* تب‌ها کارت‌مانند، انیمیشنی و رنگی */
.tab-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
}

.tab-nav a {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 15px;
    text-decoration: none;
    border-radius: 8px 8px 0 0;
    background: #f7f9fc;
color: #126b57; 
    font-weight: 500;
    font-size: 0.9em;
    transition: all 0.3s ease;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    transform: translateY(0);
    font-weight:bold;
}

.tab-nav a i {
    font-size: 1.1em;
    transition: all 0.3s ease;
}

/* حالت hover */
.tab-nav a:hover {
    background: #158269;
    color: #fff;
    transform: translateY(-1px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
}

.tab-nav a:hover i {
    color: #fff;
    transform: scale(1.2);
}
 

/* حالت فعال */
.tab-nav a.active {
    background: #28c2a0;
    color: #fff;
    font-weight: 600;
    border-bottom: 2px solid #1a9d80;
}

.tab-nav a.active i {
    color: #fff;
    transform: scale(1.1);
}
.box-tabs {
    display:flex;

    gap:30px;
    border-bottom:4px solid #126b57;
}
.nav-title {
    padding: 10px;
    margin:0 0 5px;
    background-color: #126b581e;
    border-right: 4px solid #126b57;
    border-radius: 10px;
}
</style>
