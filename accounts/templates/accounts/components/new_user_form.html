<form class="access-forms" method="post" id="newUserForm" action="{% url 'create_new_user_form' %}?user_id={{ user.id }}">
            {% csrf_token %}
            <div class="form-group">
                <label>نام</label>
                <input type="text" name="first_name" placeholder="مثلاً علی" >
            </div>
            <div class="form-group">
                <label>نام خانوادگی</label>
                <input type="text" name="last_name" placeholder="مثلاً رضایی" >
            </div>
            <div class="form-group">
                <label>نام کاربری</label>
                <input type="text" name="username" placeholder="مثلاً alirez" required>
            </div>
            <div class="form-group">
                <label>ایمیل</label>
                <input type="email" name="email" placeholder="مثلاً example@mail.com">
            </div>
            <div class="form-group">
                <label>رمز عبور</label>
                <input type="password" name="password" placeholder="رمز عبور" required>
            </div>
            <div class="form-group checkbox-button-group">
                <label>سطح دسترسی</label>
                <label class="checkbox-btn">
                    <input type="checkbox" name="is_staff">
                    <span class="btn-label">ادمین</span>
                </label>
            </div>
            <div class="form-group checkbox-button-group">
                <label>فعالیت</label>
                <label class="checkbox-btn">
                    <input type="checkbox" name="is_active">
                    <span class="btn-label">فعال</span>
                </label>
            </div>
            <button type="submit">ذخیره کاربر</button>
</form>
