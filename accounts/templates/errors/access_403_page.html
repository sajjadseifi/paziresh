{% extends 'shared/_PanelMain.html' %}
{% load static %}

{% block main %}
    <style>
        /* کارت اصلی */
        .error-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            padding: 40px 50px;
            text-align: center;
            max-width: 480px;
            margin: 80px auto;
        }

        /* آیکون هشدار */
        .error-icon {
            font-size: 80px;
            color: #dc3545;
        }

        /* عنوان‌ها */
        h1 {
            font-size: 4em;
            font-weight: bold;
            color: #dc3545;
        }

        h2 {
            font-size: 1.6em;
            margin-top: 15px;
            color: #333;
        }

        p {
            color: #555;
            font-size: 0.95em;
            margin-top: 10px;
        }

        /* دکمه بازگشت */
        .btn-home {
            background-color: #007bff;
            color: white;
            border-radius: 30px;
            padding: 10px 25px;
            margin-top: 25px;
            transition: 0.3s;
            text-decoration: none;
        }

        .btn-home:hover {
            background-color: #0056b3;
        }

        /* واکنش‌گرایی موبایل */
        @media (max-width: 576px) {
            .error-card {
                padding: 30px 20px;
            }
            h1 {
                font-size: 3em;
            }
            h2 {
                font-size: 1.3em;
            }
        }
    </style>

    <div class="error-card">
        <div class="error-icon">
            <i class="fa fa-ban"></i>
        </div>
        <h1>403</h1>
        <h2>دسترسی غیرمجاز</h2>
        <p>متأسفانه شما اجازه مشاهده یا انجام این عملیات را ندارید.</p>
        <a href="{% url 'home_page' %}" class="btn-home">بازگشت به صفحه اصلی</a>
    </div>
{% endblock %}
