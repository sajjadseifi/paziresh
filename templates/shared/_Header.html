{% load static %}
<header class="main-header" style='display:flex;'>
    <!-- Logo -->
    <a href="{% url 'home_page' %}" class="logo">
        <span class="logo-mini">رزم‌آموز</span>
        <span class="logo-lg"><b>رزم‌آموز المهدی(عج)</b></span>
    </a>

    <!-- Navbar -->
    <nav style="flex:1;margin-right:0;" class="navbar navbar-static-top">
        <a href="#" class="sidebar-toggle" data-toggle="push-menu" role="button">
            <span class="sr-only">Toggle navigation</span>
        </a>
    </nav>

    <!-- بخش اضافه شده به انتهای header -->
    <div  style="display:flex; gap:15px; align-items:center; padding:0 15px;background-color:#3c8dbc;color:white;">
        {% if request.user.is_staff == True %}
        <a href="{% url 'account_access' %}" style="color:white;" class="header-icon">
            دسترسی ها
        </a>
        {% endif %}
        <!-- مثال: نمایش کاربر آنلاین -->
        <span class="user-status">{{ request.user.first_name }} {{ request.user.last_name }}</span>

        <!-- مثال: دکمه خروج -->
        <a href="{% url 'logout' %}" style="color:white;" class="header-icon">
            <i class="fa fa-sign-out"></i>
        </a>
    </div>
</header>
