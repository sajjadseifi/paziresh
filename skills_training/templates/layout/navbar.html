<style>
.skills-navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #0d47a1; /* رنگ آبی */
    padding: 10px 20px;
    font-family: Vazir, Tahoma, sans-serif;
    direction: rtl;
    border-radius: 5px;

}

.skills-navbar .logo .nav-logo {
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    text-decoration: none;
}

.skills-navbar .nav-links {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    gap: 20px;
}

.skills-navbar .nav-links li a {
    color: #fff;
    text-decoration: none;
    padding: 5px 10px;
    border-radius: 5px;
    transition: background-color 0.2s;
}

.skills-navbar .nav-links li a:hover {
    background-color: #1565c0;
}

.skills-navbar .nav-links li a.active {
    background-color: #ffc107;
    color: #000;
    font-weight: bold;
}
</style>

<nav class="skills-navbar">
    <div class="logo">
        <a href="{% url 'skills:index' %}" class="nav-logo">مهارت‌آموزی</a>
    </div>

    <ul class="nav-links">
        <li><a href="{% url 'skills:index' %}" class="{% if request.resolver_match.url_name == 'index' %}active{% endif %}">داشبورد</a></li>
        <li><a href="{% url 'skills:assign' %}" class="{% if request.resolver_match.url_name == 'assign' %}active{% endif %}">مهارت سربازان</a></li>
        <li><a href="{% url 'skills:list' %}" class="{% if request.resolver_match.url_name == 'list' %}active{% endif %}">مهارت‌ها</a></li>
        {% comment %} <li><a href="{% url 'skills:create' %}" class="{% if request.resolver_match.url_name == 'create' %}active{% endif %}">ثبت مهارت جدید</a></li> {% endcomment %}
    </ul>
</nav>
