{% extends 'shared/_PanelMain.html' %}
{% load static %}




{% block main %}
    <section class="content">
        <div class="box">
            <div class="box-header">
                <h3 class="box-title">گردان ها</h3>

                <div class="box-body no-padding">
                    <table class="table">
                        <tbody>
                        <tr>
                            <th>نام گردان</th>
                            <th>تعداد سرباز</th>
                            <th></th>
                        </tr>
                        {% for foo in gordan %}
                            <tr>
                                <td>{{ foo.name }}</td>
                                <td><span class="badge bg-red">100</span></td>
                                <td>
                                    <a class="btn btn-app" href="{% url 'BattalionUpdate' pk=foo.pk %}">
                                        <i class="fa fa-edit"></i> ویرایش
                                    </a>
                                </td>
                            </tr>
                        {% endfor %}
                        </tbody>
                    </table>
                </div>
                <!-- /.box-body -->
            </div>
        </div>
    </section>
{% endblock %}
