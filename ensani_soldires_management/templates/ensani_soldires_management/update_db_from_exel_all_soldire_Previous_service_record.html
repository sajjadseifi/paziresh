{% extends 'shared/_PanelMain.html' %}
{% load static %}

{% block main %}
    <br>
    <br>
    <br>
    <br>
    <br>
    <div class="box">
        <div class="box-header with-border">
            <h3 class="box-title">بروزرسانی گروهی خدمت قبلی</h3>
        </div>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="box-body">
                <div class="input-group input-group-sm">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-info btn-flat">بررسی</button>
                </div>
            </div>
        </form>
    </div>
{% endblock %}
