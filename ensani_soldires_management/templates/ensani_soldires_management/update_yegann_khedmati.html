{% extends 'shared/_PanelMain.html' %}
{% load static %}

{% block main %}
    <br>
    <br>
    <br>
    <br>
    <br>
    <div class="box">
        <div class="box-header with-border">
            <h3 class="box-title">یگان خدمتی گروهی</h3>
        </div>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="box-body">
                <div class="input-group input-group-sm">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <!-- دکمه بررسی -->
                        <button type="submit" class="btn btn-success">
                            ✅ بررسی
                        </button>

                        <!-- دکمه دانلود فایل راهنما -->
                        <a href="{% url 'download_import_yegan_khdmati_sample_excel' %}" class="btn btn-warning">
                            📥 دانلود فایل خام نمونه
                        </a>
                    </div>
                </div>
            </div>
        </form>
    </div>
{% endblock %}
